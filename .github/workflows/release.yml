name: Build and release Pebble watchface

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish PBW
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set app version from tag
        id: version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Tag '$TAG_NAME' is not a version number like 1.2.3" >&2
            exit 1
          fi
          python3 - "$VERSION" <<'PY'
          import json
          import re
          import sys

          version = sys.argv[1]
          with open('package.json') as f:
              source = f.read()
          patched, count = re.subn(r'("version"\s*:\s*)"[^"]*"',
                                   lambda m: m.group(1) + '"%s"' % version,
                                   source, count=1)
          if count != 1:
              sys.exit('no version field found in package.json')
          json.loads(patched)
          with open('package.json', 'w') as f:
              f.write(patched)
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Pebble build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g

      - name: Install Pebble CLI
        run: python -m pip install --disable-pip-version-check pebble-tool==5.0.40

      - name: Install and activate Pebble SDK
        run: |
          pebble sdk install 4.33.1
          pebble sdk activate 4.33.1

      - name: Build PBW
        run: pebble build

      - name: Refresh Pebble App Store token
        id: pebble-token
        env:
          PEBBLE_FIREBASE_REFRESH_TOKEN: ${{ secrets.PEBBLE_FIREBASE_REFRESH_TOKEN }}
          PEBBLE_FIREBASE_API_KEY: ${{ secrets.PEBBLE_FIREBASE_API_KEY }}
        run: |
          RESPONSE="$(curl --fail --silent --show-error \
            --request POST \
            --url "https://securetoken.googleapis.com/v1/token?key=${PEBBLE_FIREBASE_API_KEY}" \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode 'grant_type=refresh_token' \
            --data-urlencode "refresh_token=${PEBBLE_FIREBASE_REFRESH_TOKEN}")"
          ID_TOKEN="$(python3 -c 'import json, sys; print(json.load(sys.stdin)["id_token"])' <<< "$RESPONSE")"
          echo "id_token=$ID_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Publish to Pebble App Store
        env:
          PEBBLE_FIREBASE_ID_TOKEN: ${{ steps.pebble-token.outputs.id_token }}
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pebble publish \
            --non-interactive \
            --is-published \
            --no-gif-all-platforms \
            --firebase-id-token "$PEBBLE_FIREBASE_ID_TOKEN" \
            --name "RunCat" \
            --version "$APP_VERSION" \
            --description "$(cat appstore/description.txt)" \
            --source "https://github.com/$GITHUB_REPOSITORY" \
            --category "watchfaces" \
            --icon-small appstore/icon-small.png \
            --icon-large appstore/icon-large.png \
            --screenshots appstore/emery_screenshot.png appstore/basalt_screenshot.png \
            --replace-screenshots

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PBW_PATH="$(find build -maxdepth 1 -type f -name '*.pbw' -print -quit)"
          test -n "$PBW_PATH"
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --generate-notes \
            "$PBW_PATH"
