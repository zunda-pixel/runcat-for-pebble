name: Build and release Pebble watchface

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish PBW
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pebble build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfreetype6-dev libpng-dev libsdl2-2.0-0 libglib2.0-0 libpixman-1-0 zlib1g

      - name: Install Pebble CLI
        run: python -m pip install --disable-pip-version-check pebble-tool==5.0.40

      - name: Install and activate Pebble SDK
        run: |
          pebble sdk install 4.33.1
          pebble sdk activate 4.33.1

      - name: Build PBW
        run: pebble build

      - name: Create GitHub release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          PBW_PATH="$(find build -maxdepth 1 -type f -name '*.pbw' -print -quit)"
          test -n "$PBW_PATH"
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "RunCat for Pebble $TAG_NAME" \
            --generate-notes \
            "$PBW_PATH"
